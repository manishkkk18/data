<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="description" content="How bright each Indian district is at night, month by month, from NASA Black Marble satellite data." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>India Night Lights</title>
    <!-- Visitor counts: GoatCounter, same account as the portfolio (no cookies). -->
    <script data-goatcounter="https://manishkukreja.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <!-- Start the data downloads and basemap connection while the app code loads. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preload" href="%BASE_URL%data/districts.geojson" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="%BASE_URL%data/monthly.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="%BASE_URL%data/india_outline.geojson" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
