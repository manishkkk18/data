# Highway corridors, on GitHub's machines so it doesn't need a laptop.
# Road lines come from OpenStreetMap (Overpass API); brightness from NASA's annual
# Black Marble composites (VNP46A4). Each year downloads in its own job, then one job
# measures every corridor, commits apps/night-lights/data/corridors.* and redeploys the site.
#
# Needs the EARTHDATA_TOKEN repository secret.
name: Night Lights highway corridors

on:
  workflow_dispatch:
    inputs:
      last_full_year:
        description: "Last year with NASA's annual product"
        default: "2025"

permissions:
  contents: write
  pages: write    # for the deploy job
  id-token: write # for the deploy job

concurrency:
  group: night-lights-data # never at the same time as the other data jobs
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  roads:
    name: Road lines (OpenStreetMap)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: apps/night-lights/pipeline/requirements.txt }
      - run: pip install -r apps/night-lights/pipeline/requirements.txt
      # Road lines only change when the corridor definitions do; reuse them otherwise.
      - uses: actions/cache@v6
        with: { path: apps/night-lights/data/raw/osm, key: "osm-${{ hashFiles('pipeline/nightlights/corridors.py') }}" }
      - working-directory: apps/night-lights/pipeline
        run: python -m nightlights.corridors --fetch-roads
      - uses: actions/upload-artifact@v7
        with: { name: osm, path: apps/night-lights/data/raw/osm/*.json, retention-days: 7 }

  rasters:
    name: Annual ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4 # be fair to NASA's server
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: apps/night-lights/pipeline/requirements.txt }
      - run: pip install -r apps/night-lights/pipeline/requirements.txt
      - uses: actions/cache@v6
        with: { path: apps/night-lights/data/raw/boundaries, key: boundaries-9469f09 }
      - working-directory: apps/night-lights/pipeline
        run: python -m nightlights.boundaries
      - name: Download ${{ matrix.year }}
        if: matrix.year <= fromJSON(github.event.inputs.last_full_year)
        working-directory: apps/night-lights/pipeline
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python -m nightlights.corridors --download-rasters --start ${{ matrix.year }} --end ${{ matrix.year }}
      - uses: actions/upload-artifact@v7
        with:
          name: annual-raster-${{ matrix.year }}
          path: apps/night-lights/data/raw/india_yearly/*.tif
          if-no-files-found: ignore
          retention-days: 7

  measure:
    name: Measure, commit and deploy
    needs: [roads, rasters]
    if: always() # publish whatever finished, even if some years failed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: apps/night-lights/pipeline/requirements.txt }
      - run: pip install -r apps/night-lights/pipeline/requirements.txt
      - uses: actions/download-artifact@v8
        with: { name: osm, path: apps/night-lights/data/raw/osm }
      - uses: actions/download-artifact@v8
        with: { pattern: annual-raster-*, path: apps/night-lights/data/raw/india_yearly, merge-multiple: true }
      - name: Measure corridors
        working-directory: apps/night-lights/pipeline
        run: |
          ls -la ../data/raw/india_yearly ../data/raw/osm
          python -m nightlights.corridors --start 2015 --end "${{ github.event.inputs.last_full_year }}"
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/night-lights/data/corridors.json apps/night-lights/data/corridors.geojson apps/night-lights/data/corridor_segments.geojson
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing new."; else
            git commit -m "Highway corridors: $(ls apps/night-lights/data/raw/india_yearly/*.tif | wc -l) years, $(ls apps/night-lights/data/raw/osm/*.json | wc -l) roads"
            git pull --rebase --autostash && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: measure
    if: needs.measure.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
