# Run the data pipeline by hand with the real keys, and report what came back.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   FIRMS_MAP_KEY   https://firms.modaps.eosdis.nasa.gov/api/map_key/
#   OPENAQ_API_KEY  https://explore.openaq.org/register
#
# For now this only checks the data: it runs the tests and the pipeline, writes a summary
# on the run page and keeps the JSON as a downloadable artifact. It does not commit or
# deploy anything; the schedule and GitHub Pages deploy come in Phase 6.
name: Run pipeline (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to fetch"
        default: "7"
      diagnose_aq:
        description: "Instead, list Delhi OpenAQ locations and their archive coverage"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Check the secrets are set (values are never printed)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          [ -n "$FIRMS_MAP_KEY" ] && echo "FIRMS_MAP_KEY: set" || echo "::warning::FIRMS_MAP_KEY is not set"
          [ -n "$OPENAQ_API_KEY" ] && echo "OPENAQ_API_KEY: set" || echo "::warning::OPENAQ_API_KEY is not set"

      - name: Tests
        working-directory: pipeline
        run: PYTHONPATH=. python -X utf8 -m pytest -q tests

      - name: Diagnose Delhi air-quality locations
        if: github.event.inputs.diagnose_aq == 'true'
        working-directory: pipeline
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: PYTHONPATH=. python -X utf8 -m smokewatch.diagnose_aq >> "$GITHUB_STEP_SUMMARY"

      - name: Clear old outputs (so a failed step shows as missing, not stale)
        run: rm -f data/*.json

      - name: Run pipeline
        working-directory: pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: PYTHONPATH=. python -X utf8 -m smokewatch.run --days "${{ github.event.inputs.days || '7' }}"

      - name: Summary
        if: always()
        working-directory: pipeline
        run: PYTHONPATH=. python -X utf8 -m smokewatch.report >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: data
          path: |
            data/*.json
          retention-days: 7
