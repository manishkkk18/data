# India Smoke Watch: build the "Diwali effect" files (hourly PM2.5/PM10 around Diwali night,
# every city, 2020 onwards, plus Delhi's wind, ventilation and upwind fire load) and redeploy.
# Re-run by hand after changing the method; the daily refresh keeps the current year updated
# from 3 days before to 14 days after Diwali.
#
# Needs OPENAQ_API_KEY (to list each city's stations). Readings come from OpenAQ's public
# archive, weather from ERA5 (Open-Meteo archive, no key).
name: Smoke Watch Diwali effect

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years, e.g. 2020-2026 or 2026"
        default: "2020-2026"
      city:
        description: "Only this city id (e.g. delhi); empty = every city"
        default: ""

permissions:
  contents: write
  pages: write    # for the deploy job
  id-token: write # for the deploy job

concurrency:
  group: smoke-watch-data # never alongside the refresh, which also commits Smoke Watch data
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  diwali:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/smoke-watch/pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r apps/smoke-watch/pipeline/requirements.txt

      - name: Tests
        working-directory: apps/smoke-watch/pipeline
        run: PYTHONPATH=. python -m pytest -q tests

      - name: Build the Diwali files
        working-directory: apps/smoke-watch/pipeline
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          CITY="${{ github.event.inputs.city }}"
          PYTHONPATH=. python -m smokewatch.diwali --years "${{ github.event.inputs.years || '2020-2026' }}" ${CITY:+--city "$CITY"}

      - name: Summary
        if: always()
        working-directory: apps/smoke-watch
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = pathlib.Path("data/diwali")
          if not (d / "index.json").exists():
              print("No Diwali index was written."); raise SystemExit
          print("| City | Year | Hours with data | US Embassy hours | Normal night | Diwali night | Above normal | Peak | Back to normal |")
          print("|---|---|---:|---:|---:|---:|---:|---|---|")
          for f in sorted(d.glob("*.json")):
              if f.name == "index.json":
                  continue
              c = json.loads(f.read_text())
              for y, v in sorted(c["years"].items()):
                  if not v.get("available"):
                      print(f"| {c['name']} | {y} | 0 | | | | | | |"); continue
                  s = v["stats"]; pk = s.get("peak") or {}
                  print(f"| {c['name']} | {y} | {sum(x is not None for x in v['pm25'])} of {len(v['pm25'])} | {v['embassy_hours']} | "
                        f"{s['baseline']} | {s['night_mean']} | {s['pct_above']}% | {pk.get('value')} at {str(pk.get('hour'))[11:]} | "
                        f"{s['back_to_normal_h'] if s['back_to_normal_h'] is not None else s['back_note']} |")
          EOF

      - name: Commit the Diwali files
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/smoke-watch/data/diwali
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Smoke Watch Diwali data $(date -u +%Y-%m-%d)"
            git pull --rebase -q
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: diwali
    if: always() && needs.diwali.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
