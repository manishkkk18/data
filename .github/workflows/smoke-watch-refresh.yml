# India Smoke Watch: refresh the live data and redeploy the whole site.
#
# Schedule: every 3 hours. Inside the burning season (15 Sep - 15 Dec, IST) every run works;
# outside it, only the 03:47 UTC run (09:17 IST) does, so the site still updates daily.
# The current season's files are rebuilt once a day (that same slot), until 17 Dec.
#
# Where the data lives:
#   - Live files (fires, wind, air's path, air quality: ~2 MB) go to the smoke-watch-data
#     branch as ONE commit that replaces the last, so the repo doesn't grow. The deploy reads
#     them from there, so a Night Lights deploy never loses them.
#   - The daily season update and a small status file are committed to main (this also keeps
#     the schedule from being switched off after 60 days without activity).
#
# If a source fails, its previous file (from the smoke-watch-data branch) is kept and marked
# stale. If NASA FIRMS fails completely, the run stops and nothing is published.
#
# Needs FIRMS_MAP_KEY and OPENAQ_API_KEY repository secrets (never printed).
name: Smoke Watch refresh

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Also rebuild the current season"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write    # for the deploy job
  id-token: write # for the deploy job

concurrency:
  group: smoke-watch-data # never two Smoke Watch data jobs at once (Night Lights has its own group)
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  APP: apps/smoke-watch

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # Open-Meteo can be slow from GitHub's servers; runs are 3 h apart
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Decide what this run does
        id: gate
        run: |
          MD=$(TZ=Asia/Kolkata date +%m%d)          # e.g. 1117
          YEAR=$(TZ=Asia/Kolkata date +%Y)
          HOUR=$(date -u +%H)
          IN_SEASON=false; [ "$MD" -ge 0915 ] && [ "$MD" -le 1215 ] && IN_SEASON=true
          DAILY=false; [ "$HOUR" = "03" ] && DAILY=true
          MANUAL=false; [ "${{ github.event_name }}" = "workflow_dispatch" ] && MANUAL=true
          RUN=false; { [ "$IN_SEASON" = true ] || [ "$DAILY" = true ] || [ "$MANUAL" = true ]; } && RUN=true
          SEASON=false
          if [ "$MD" -ge 0915 ] && [ "$MD" -le 1217 ]; then
            { [ "$DAILY" = true ] || [ "${{ github.event.inputs.season }}" = "true" ]; } && SEASON=true
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"; echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "daily=$DAILY" >> "$GITHUB_OUTPUT"; echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "IST $MD, UTC hour $HOUR: in season $IN_SEASON, run $RUN, season update $SEASON"

      # Without its keys the pipeline would fall back to dev-only public files; never publish that.
      - name: Check the secrets are set (values are never printed)
        if: steps.gate.outputs.run == 'true'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          missing=""
          [ -n "$FIRMS_MAP_KEY" ] || missing="$missing FIRMS_MAP_KEY"
          [ -n "$OPENAQ_API_KEY" ] || missing="$missing OPENAQ_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing. Nothing is published."; exit 1; fi
          echo "Both secrets are set."

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/smoke-watch/pipeline/requirements.txt

      - name: Install pipeline
        if: steps.gate.outputs.run == 'true'
        run: pip install -r $APP/pipeline/requirements.txt

      - name: Tests
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/smoke-watch/pipeline
        run: PYTHONPATH=. python -m pytest -q tests

      - name: Last published live data (kept if a source fails this run)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: smoke-watch-data
          path: _previous

      - name: Put it where the pipeline expects it
        if: steps.gate.outputs.run == 'true'
        run: |
          rm -rf _previous/.git _previous/README.md
          cp -R _previous/. $APP/data/
          rm -rf _previous

      - name: Live data
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/smoke-watch/pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: PYTHONPATH=. python -m smokewatch.run --days 7

      - name: Current season (daily)
        if: steps.gate.outputs.season == 'true'
        working-directory: apps/smoke-watch/pipeline
        continue-on-error: true # a failed season update shouldn't block the live refresh
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: PYTHONPATH=. python -m smokewatch.season --years "${{ steps.gate.outputs.year }}"

      - name: Status file (daily)
        if: steps.gate.outputs.run == 'true' && (steps.gate.outputs.daily == 'true' || steps.gate.outputs.season == 'true')
        working-directory: apps/smoke-watch
        run: |
          python - <<'EOF'
          import json, pathlib, datetime
          meta = json.loads(pathlib.Path("data/meta.json").read_text())
          status = {"last_daily_run_utc": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
                    "fires_latest_detection_utc": (meta.get("fires") or {}).get("latest_detection_utc"),
                    "stale": [k for k, v in meta.items() if isinstance(v, dict) and v.get("stale")]}
          pathlib.Path("data/status.json").write_text(json.dumps(status, indent=1) + "\n")
          print(status)
          EOF

      - name: Commit season data and status to main
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $APP/data/seasons $APP/data/status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Smoke Watch data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q
            git push
          fi

      - name: Publish the live files to the smoke-watch-data branch (one commit, replaced)
        id: publish
        if: steps.gate.outputs.run == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir _out
          cd $APP/data
          cp -R --parents meta.json fires_summary_recent.json live aq upwind ../../../_out/ 2>/dev/null || true
          for f in wind_recent.json cities.json; do [ -f "$f" ] && cp "$f" ../../../_out/; done
          cd ../../../_out
          test -f live/index.json || { echo "::error::No live/index.json, so nothing is published"; exit 1; }
          printf '# Smoke Watch live data\n\nThe latest published live files for apps/smoke-watch (fires, wind, air quality, air paths).\nReplaced on every refresh as a single commit, so this branch never grows. Not for editing.\n' > README.md
          git init -q -b smoke-watch-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke Watch live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" smoke-watch-data
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published $(find . -name '*.json' | wc -l) files"

      - name: Summary
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: apps/smoke-watch/pipeline
        run: PYTHONPATH=. python -m smokewatch.report >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    needs: refresh
    if: needs.refresh.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
