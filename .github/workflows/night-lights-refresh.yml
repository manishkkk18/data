# Monthly data refresh: process any new NASA Black Marble months, refresh the ISRO
# Bhuvan cross-check, commit the small output files, and redeploy the site.
#
# Needs one repository secret: EARTHDATA_TOKEN (NASA Earthdata bearer token).
# Runs on the 18th of each month (NASA posts a month's composite ~2 weeks after it
# ends) and can be started by hand from the Actions tab.
name: Night Lights monthly refresh

on:
  schedule:
    - cron: "0 6 18 * *"
  workflow_dispatch:
    inputs:
      months_back:
        description: "How many recent months to (re)check"
        default: "3"

permissions:
  contents: write
  pages: write    # for the deploy job
  id-token: write # for the deploy job

concurrency:
  group: night-lights-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/night-lights/pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r apps/night-lights/pipeline/requirements.txt

      - name: Cache boundary downloads
        uses: actions/cache@v6
        with:
          path: apps/night-lights/data/raw/boundaries
          key: boundaries-9469f09

      - name: Build district boundaries (pinned release)
        working-directory: apps/night-lights/pipeline
        run: python -X utf8 -m nightlights.boundaries

      - name: Process recent months
        working-directory: apps/night-lights/pipeline
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          BACK="${{ github.event.inputs.months_back || '3' }}"
          START=$(date -u -d "$(date -u +%Y-%m-01) -${BACK} month" +%Y-%m)
          END=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          echo "Checking $START to $END"
          python -X utf8 -m nightlights.run --start "$START" --end "$END"
          cat ../data/stats/VNP46A3/failures.json

      - name: Refresh ISRO Bhuvan cross-check
        working-directory: apps/night-lights/pipeline
        continue-on-error: true # Bhuvan being down shouldn't block the refresh
        run: python -X utf8 -m nightlights.crosscheck --refresh

      - name: Commit new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/night-lights/data/stats apps/night-lights/data/monthly.json apps/night-lights/data/crosscheck.json apps/night-lights/data/districts.geojson apps/night-lights/data/india_outline.geojson
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No new data."
          else
            git commit -m "Night Lights data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase -q # Smoke Watch commits to main too
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
